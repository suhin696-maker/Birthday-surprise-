<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise ❤️</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e7, #fff0f6);
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow-x: hidden;
}

.card {
  width: 90%;
  max-width: 600px;
  background: white;
  padding: 30px 20px;
  border-radius: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

h1 {
  color: #e75480;
}

p {
  font-size: 18px;
  line-height: 1.7;
}

button {
  border: none;
  border-radius: 30px;
  padding: 14px 28px;
  margin: 8px;
  font-size: 17px;
  cursor: pointer;
}

.yes {
  background: #ff4f81;
  color: white;
}

.no {
  background: #eeeeee;
  color: #333;
}

.hidden {
  display: none;
}

#reaction {
  color: #e75480;
  font-weight: bold;
  min-height: 35px;
}

#typedMessage {
  text-align: left;
  white-space: pre-wrap;
  line-height: 1.8;
}

.photo {
  width: 100%;
  max-width: 450px;
  margin: 20px auto;
  border-radius: 20px;
  display: block;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

.countdown {
  font-size: 100px;
  color: #e75480;
  font-weight: bold;
  animation: pop 1s ease;
}

.dance {
  font-size: 80px;
  animation: dance 0.7s infinite alternate;
}

@keyframes dance {
  from {
    transform: rotate(-12deg) translateY(0);
  }
  to {
    transform: rotate(12deg) translateY(-12px);
  }
}

@keyframes pop {
  0% {
    transform: scale(0.3);
    opacity: 0;
  }
  60% {
    transform: scale(1.2);
    opacity: 1;
  }
  100% {
    transform: scale(1);
  }
}
</style>
</head>

<body>

<!-- SCREEN 1 -->

<div class="card" id="screen1">

  <div style="font-size:60px;">🎁</div>

  <h1>Hey you... 👀❤️</h1>

  <p>
    I have a little surprise for you... 🥹✨
  </p>

  <p>
    Do you want to see? 👀💗
  </p>

  <button class="yes" onclick="firstYes()">
    YES ❤️
  </button>

  <button class="no" onclick="firstNo()">
    NO 😭
  </button>

  <p id="reaction1"></p>

</div>


<!-- SCREEN 2 -->

<div class="card hidden" id="screen2">

  <div class="dance">💃🏻</div>

  <h1>Are you excited? 👀✨</h1>

  <p>
    I hope you are... 🥹❤️
  </p>

  <button class="yes" onclick="excitedYes()">
    YES ❤️
  </button>

  <button class="no" onclick="excitedNo()">
    NO 😭
  </button>

  <p id="reaction2"></p>

</div>


<!-- SCREEN 3 : AUTOMATIC COUNTDOWN -->

<div class="card hidden" id="countdownScreen">

  <div id="countdown" class="countdown">3</div>

</div>


<!-- SCREEN 4 -->

<div class="card hidden" id="screen4">

  <div style="font-size:70px;">👀❤️</div>

  <h1>Did you want to see? 🥹✨</h1>

  <button class="yes" onclick="finalYes()">
    YES ❤️
  </button>

</div>


<!-- FINAL SURPRISE -->

<div class="card hidden" id="finalScreen">

  <div style="font-size:60px;">🎉🎂❤️</div>

  <h1>HAPPY BIRTHDAYYY! 🥳❤️</h1>

  <p id="typedMessage"></p>

  <img
    class="photo"
    src="IMG-20260830-WA0014.jpg"
    alt="Memory ❤️"
  >

  <img
    class="photo"
    src="Untitled94_20260723193909.png"
    alt="Beautiful memory ❤️"
  >

  <h2>Happiest Birthday once again! 🎂❤️</h2>

  <p>
    🥹🫶🏻✨🎈🎉💗
  </p>

</div>

  document.getElementById("reaction1").innerText =

  no1++;

function firstYes() {

  document.getElementById("screen2").classList.remove("hidden");

}

  no2++;

}
