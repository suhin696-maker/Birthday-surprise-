<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise ❤️</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e7, #fff0f6);
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.card {
  width: 90%;
  max-width: 600px;
  background: white;
  padding: 30px 20px;
  border-radius: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

h1 {
  color: #e75480;
}

p {
  font-size: 18px;
  line-height: 1.7;
}

button {
  border: none;
  border-radius: 30px;
  padding: 14px 28px;
  margin: 8px;
  font-size: 17px;
}

.yes {
  background: #ff4f81;
  color: white;
}

.no {
  background: #eeeeee;
}

.hidden {
  display: none;
}

.photo {
  width: 100%;
  max-width: 450px;
  margin: 20px auto;
  border-radius: 20px;
  display: block;
}

#message {
  text-align: left;
  white-space: pre-wrap;
}

#reaction {
  color: #e75480;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card" id="question">

  <div style="font-size:60px;">🎁</div>

  <h1>Hey you... 👀❤️</h1>

  <p>
    I have a little surprise for you... 🥹✨
  </p>

  <p>
    Do you want to see it? 👀💗
  </p>

  <button class="yes" onclick="showSurprise()">
    YES ❤️
  </button>

  <button class="no" onclick="noClicked()">
    NO 😭
  </button>

  <p id="reaction"></p>

</div>


<div class="card hidden" id="surprise">

  <div style="font-size:60px;">🎉🎂❤️</div>

  <h1>HAPPY BIRTHDAYYY! 🥳❤️</h1>

  <p id="message"></p>

  09.png"
  <img
  class="photo"
  src="./IMG-20260830-WA0014.jpg"
  alt="Our memory ❤️"
>

<img
  class="photo"
  src="./Untitled94_20260723193909.png"
  alt="Beautiful memory ❤️"
>
>

  <h2>Happiest Birthday once again! 🎂❤️</h2>

  <p>🥹🫶🏻✨🎈🎉</p>

</div>


<script>

let noCount = 0;

const reactions = [
  "Are you sure? 🥺👉🏻👈🏻",
  "Reallyyy? 😭💔",
  "Pleaseee say yes! 🥹❤️",
  "Think again 😂",
  "Why NO? 😭😂",
  "One more chance? 🥺🫶🏻",
  "TRY AGAIN! 🔄😂"
];

function noClicked() {

  document.getElementById("reaction").innerText =
    reactions[noCount % reactions.length];

  noCount++;

}


function showSurprise() {

  document.getElementById("question").classList.add("hidden");

  document.getElementById("surprise").classList.remove("hidden");

  typeMessage();

}


function typeMessage() {

  const text =
`Happy Birthdayyy! 🥳❤️

I hope this special day brings you lots of happiness, laughter, and beautiful memories. You’re honestly one of those people who can make an ordinary day better just by being there. I’m really glad that I got to know you, and I truly value all the conversations, jokes, teasing, and random moments we’ve shared. 🫶🏻✨

I hope this new year of your life brings you closer to all your dreams and gives you countless reasons to smile. Never stop being the person you are, because you’re genuinely amazing in your own way.

No matter what happens or how much things change, I hope our friendship always stays the same.

Have the best birthday everrr! 🎂❤️

And once again, happiest birthday to you! 🥹🫶🏻✨`;

  let i = 0;

  const box = document.getElementById("message");

  function type() {

    if (i < text.length) {

      box.innerText += text.charAt(i);

      i++;

      setTimeout(type, 20);

    }

  }

  type();

}

</script>

</body>
</html>
